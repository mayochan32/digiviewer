<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DigiViewer</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <strong>DigiViewer</strong>
          <span id="app-version" class="app-version">v0.5.0</span>
          <span id="image-count">0 / 0</span>
          <div id="perf-meter" class="perf-meter" aria-label="処理時間">計測: -</div>
        </div>
        <div class="topbar-actions">
          <button id="choose-folder" type="button" class="file-button">フォルダ</button>
          <button id="reload-folder" type="button" class="file-button" disabled>リロード</button>
          <button id="choose-files" type="button" class="file-button">画像</button>
          <input id="open-folder" class="hidden-file-input" type="file" webkitdirectory multiple />
          <input id="open-files" class="hidden-file-input" type="file" accept="image/*,.heic,.heif" multiple />
          <button id="build-thumb-cache" type="button" class="tool-button" disabled>サムネ作成</button>
          <span id="thumb-cache-status" class="thumb-cache-status"></span>
          <button id="settings-button" type="button" class="tool-button">設定</button>
        </div>
      </header>

      <section class="workspace">
        <section class="viewer-panel">
          <footer class="exif-bar">
            <span id="exif-text">EXIF情報</span>
            <span id="gps-text">GPSなし</span>
            <button id="map-button" type="button" class="map-button" hidden>地図</button>
          </footer>

          <aside class="thumb-rail" aria-label="画像一覧">
            <div id="thumbs" class="thumbs"></div>
          </aside>

          <div class="similarity-toolbar" aria-label="類似写真の整理">
            <button id="analyze-similarity" type="button" class="tool-button" disabled>類似解析</button>
            <select id="similarity-threshold" class="similarity-select" aria-label="類似度">
              <option value="6">厳しい</option>
              <option value="10" selected>標準</option>
              <option value="16">ゆるい</option>
            </select>
            <button id="similarity-toggle" type="button" class="tool-button" aria-pressed="false" disabled>グループ表示</button>
            <button id="previous-group" type="button" class="icon-button" title="前の類似グループ" disabled>‹</button>
            <button id="next-group" type="button" class="icon-button" title="次の類似グループ" disabled>›</button>
            <span id="similarity-status" class="similarity-status">未解析</span>
            <span class="similarity-spacer"></span>
            <span id="review-target" class="review-target">対象: 表示中</span>
            <button type="button" class="review-button review-keep" data-review-status="keep">採用</button>
            <button type="button" class="review-button review-hold" data-review-status="hold">保留</button>
            <button type="button" class="review-button review-exclude" data-review-status="exclude">一時除外</button>
            <button type="button" class="review-button" data-review-status="unreviewed">未判定</button>
            <button id="hide-excluded" type="button" class="tool-button" aria-pressed="false">一時除外を隠す</button>
            <button id="move-excluded-deleted" type="button" class="tool-button" disabled>一時除外をdeletedへ</button>
          </div>

          <div class="viewer-toolbar">
            <button id="prev-button" type="button" class="icon-button" disabled title="前の画像">←</button>
            <button id="next-button" type="button" class="icon-button" disabled title="次の画像">→</button>
            <button id="fit-button" type="button" class="tool-button">フィット</button>
            <button id="actual-button" type="button" class="tool-button">等倍</button>
            <span id="zoom-value" class="zoom-readout">100%</span>
            <span id="selection-count" class="selection-count">選択 0</span>
            <div class="segmented" aria-label="比較枚数">
              <button type="button" data-compare-count="1" aria-pressed="true">1</button>
              <button type="button" data-compare-count="2" aria-pressed="false">2</button>
              <button type="button" data-compare-count="3" aria-pressed="false">3</button>
              <button type="button" data-compare-count="4" aria-pressed="false">4</button>
            </div>
            <button id="sync-toggle" type="button" class="tool-button" aria-pressed="true">同期 ON</button>
            <button id="append-species" type="button" class="tool-button" disabled>種名付加</button>
            <button id="copy-files" type="button" class="tool-button" disabled>コピー</button>
            <button id="move-deleted" type="button" class="tool-button" disabled>deletedへ移動</button>
            <button id="clear-file-selection" type="button" class="tool-button" disabled>選択解除</button>
            <input id="filename-filter" class="filename-filter" type="search" placeholder="ファイル名フィルタ" autocomplete="off" />
            <div class="active-file">
              <strong id="active-name">フォルダまたは画像を選択</strong>
              <span id="active-meta">画像を読み込むとここにファイル情報が表示されます。</span>
            </div>
          </div>

          <div id="viewer" class="viewer">
            <div id="empty-state" class="empty-state">
              <h1>大量画像を、止まらず見る。</h1>
              <p>フォルダを選んで、矢印キーで移動。数字キー 1-4 で比較枚数を切り替え。ホイールで拡大、ドラッグで移動できます。</p>
            </div>
            <div id="compare-grid" class="compare-grid compare-1" hidden></div>
            <button id="viewer-prev-button" type="button" class="viewer-nav-button viewer-nav-prev" title="前の画像" disabled>‹</button>
            <button id="viewer-next-button" type="button" class="viewer-nav-button viewer-nav-next" title="次の画像" disabled>›</button>
            <section id="map-panel" class="map-panel" hidden>
              <div class="map-panel-header">
                <strong>撮影場所</strong>
                <button id="map-close" type="button" class="icon-button" title="地図を閉じる">×</button>
              </div>
              <iframe id="map-frame" title="GPS撮影場所の地図"></iframe>
            </section>
            <div id="selection-box" class="selection-box" hidden></div>
            <div id="crop-actions" class="crop-actions" hidden>
              <button id="crop-save" type="button">保存</button>
              <select id="crop-aspect" aria-label="crop縦横比">
                <option value="free">任意</option>
                <option value="1:1">1:1</option>
                <option value="3:2">3:2</option>
                <option value="4:3">4:3</option>
              </select>
              <label class="crop-toggle">
                <input id="crop-upscale" type="checkbox" />
                <span>2倍</span>
              </label>
              <button id="crop-cancel" type="button">取消</button>
              <span id="crop-status" class="crop-status"></span>
            </div>
          </div>
        </section>
      </section>
    </main>

    <div id="species-dialog" class="modal-backdrop" hidden>
      <section class="species-dialog" role="dialog" aria-modal="true" aria-labelledby="species-dialog-title">
        <h2 id="species-dialog-title">種名を付加</h2>
        <p id="species-dialog-message">選択した画像のファイル名に種名を追加します。</p>
        <input id="species-name-input" type="text" autocomplete="off" placeholder="例: ナミアゲハ" />
        <div class="dialog-actions">
          <button id="species-cancel" type="button" class="tool-button">キャンセル</button>
          <button id="species-ok" type="button" class="tool-button">OK</button>
        </div>
      </section>
    </div>

    <div id="settings-dialog" class="modal-backdrop" hidden>
      <section class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-dialog-title">
        <header class="settings-header">
          <h2 id="settings-dialog-title">設定</h2>
          <button id="settings-close" type="button" class="icon-button" title="設定を閉じる">×</button>
        </header>
        <div class="settings-grid">
          <label class="settings-field">
            <span>本画像先読み</span>
            <input id="preload-radius" type="number" min="0" max="50" step="1" value="6" />
          </label>
          <label class="settings-field">
            <span>サムネ先読み</span>
            <input id="thumb-preload-radius" type="number" min="0" max="1000" step="10" value="120" />
          </label>
          <label class="settings-field">
            <span>容量MB</span>
            <input id="thumb-cache-limit" type="number" min="64" max="10240" step="64" value="1024" />
          </label>
          <label class="settings-check">
            <input id="perf-visible" type="checkbox" checked />
            <span>計測表示</span>
          </label>
          <label class="settings-field">
            <span>文字サイズ</span>
            <select id="font-size-mode">
              <option value="small">小</option>
              <option value="medium">中</option>
              <option value="large">大</option>
            </select>
          </label>
        </div>
        <div class="settings-actions">
          <button id="clean-thumb-cache" type="button" class="tool-button" disabled>サムネ整理</button>
          <button id="clear-thumb-cache" type="button" class="tool-button" disabled>サムネ削除</button>
        </div>
      </section>
    </div>
  </body>
</html>
